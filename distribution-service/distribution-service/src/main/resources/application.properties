spring.application.name=distribution-service
server.port=8082

# postgres connection - the database must already exist (see step 1)
# change the password to the one you set when installing postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/distribution_db
spring.datasource.username=postgres
spring.datasource.password=root

# hibernate makes the tables for us from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# these two lines make data.sql run AFTER the tables are created
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true