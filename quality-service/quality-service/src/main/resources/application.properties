spring.application.name=quality-service
server.port=8083

# PostgreSQL - create the database once with: CREATE DATABASE quality_db;
# Set DB_USERNAME / DB_PASSWORD as environment variables, or replace the defaults below on your own machine only.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quality_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate creates/updates the tables, then data.sql inserts the demo rows
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Send dates as 2026-10-10T06:00:00 instead of numbers
spring.jackson.serialization.write-dates-as-timestamps=false
