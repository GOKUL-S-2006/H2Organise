spring.application.name=quality-service
server.port=8083

# PostgreSQL (database quality_db must exist: see db/01_create_database.sql)
spring.datasource.url=jdbc:postgresql://localhost:5432/quality_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:26MCA0050}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate: tables are created and updated automatically from the entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# data.sql runs after Hibernate has created the tables (it is safe to run on every start)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
