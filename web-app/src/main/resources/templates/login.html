<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>H2Organise - Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="login-page">
    <div class="box">
        <h2>Login</h2>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <p class="msg" th:if="${msg}" th:text="${msg}"></p>
        <form action="/login" method="post">
            <p><label>Email</label><input type="email" name="email" required></p>
            <p><label>Password</label><input type="password" name="password" required></p>
            <p><button type="submit">Login</button></p>
        </form>
    </div>

    <div class="box">
        <h2>New citizen? Register</h2>
        <form action="/register" method="post">
            <p><label>Full name</label><input type="text" name="fullName" required></p>
            <p><label>Email</label><input type="email" name="email" required></p>
            <p><label>Password</label><input type="password" name="password" required></p>
            <p><label>Phone</label><input type="text" name="phone"></p>
            <p><label>Zone</label>
                <select name="zoneId">
                    <option value="1">North</option>
                    <option value="2">South</option>
                    <option value="3">East</option>
                    <option value="4">West</option>
                </select>
            </p>
            <p><button type="submit">Register</button></p>
        </form>
    </div>
</div>
</body>
</html>
