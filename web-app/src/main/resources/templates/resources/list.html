<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>H2Organise - Water Sources</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="content">
        <h1>Water Sources</h1>

        <table>
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Type</th>
                <th>Zone</th>
                <th>Capacity (ML)</th>
                <th>Level</th>
                <th>Min %</th>
                <th>Status</th>
                <th></th>
            </tr>
            <tr th:each="s : ${sources}">
                <td th:text="${s.id}"></td>
                <td><a th:href="@{/resources/{id}(id=${s.id})}" th:text="${s.name}"></a></td>
                <td th:text="${s.type}"></td>
                <td th:text="${s.zoneId}"></td>
                <td th:text="${s.totalCapacity}"></td>
                <td th:text="${s.levelPercent != null} ? ${s.levelPercent} + '%' : '-'"
                    th:class="${s.levelPercent != null and s.levelPercent < s.minThresholdPercent} ? 'CRITICAL' : ''"></td>
                <td th:text="${s.minThresholdPercent}"></td>
                <td th:text="${s.status}"></td>
                <td>
                    <form th:action="@{/resources/{id}/delete(id=${s.id})}" method="post"
                          onsubmit="return confirm('Delete this source?')">
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
        </table>

        <div class="box">
            <h3>Add source</h3>
            <form action="/resources" method="post">
                <p><label>Name</label><input type="text" name="name" required></p>
                <p><label>Type</label>
                    <select name="type">
                        <option>RESERVOIR</option>
                        <option>LAKE</option>
                        <option>WELL</option>
                        <option>TANK</option>
                        <option>RIVER</option>
                    </select>
                </p>
                <p><label>Location</label><input type="text" name="location"></p>
                <p><label>Capacity (ML)</label><input type="number" step="0.1" name="totalCapacity" required></p>
                <p><label>Min level %</label><input type="number" name="minThresholdPercent" value="30"></p>
                <p><label>Zone</label>
                    <select name="zoneId">
                        <option th:each="z : ${zones}" th:value="${z.id}" th:text="${z.name}"></option>
                    </select>
                </p>
                <p><label>Commissioned</label><input type="date" name="commissionedDate"></p>
                <p><button type="submit">Add</button></p>
            </form>
        </div>
    </div>
</div>
</body>
</html>
