<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f7fa;
        }

        .navbar {
            background-color: #1f4e79;
            color: white;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            padding: 30px;
        }

        h1 {
            color: #333;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin: 25px 0;
        }

        .card {
            background: white;
            padding: 20px;
            width: 190px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin-top: 0;
            color: #555;
        }

        .value {
            font-size: 26px;
            font-weight: bold;
            color: #1f4e79;
        }

        .section {
            background: white;
            padding: 20px;
            margin-top: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .button {
            display: inline-block;
            padding: 10px 18px;
            margin: 8px 8px 8px 0;
            background-color: #1f4e79;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .button:hover {
            background-color: #163a5c;
        }
    </style>
</head>

<body>

<div class="navbar">
    H2Organise - Admin Portal
</div>

<div class="container">

    <h1>Admin Dashboard</h1>

    <div class="cards">

        <div class="card">
            <h3>Total Users</h3>
            <p class="value">3</p>
        </div>

        <div class="card">
            <h3>Zones</h3>
            <p class="value">2</p>
        </div>

        <div class="card">
            <h3>Resources</h3>
            <p class="value">3</p>
        </div>

        <div class="card">
            <h3>Open Issues</h3>
            <p class="value">2</p>
        </div>

    </div>

    <div class="section">

        <h2>Administration</h2>

        <a href="/admin/users" class="button">
            Manage Users
        </a>

        <a href="/admin/zones" class="button">
            Manage Zones
        </a>

    </div>

    <div class="section">

        <h2>System Overview</h2>

        <p><strong>Critical Zone:</strong> North Zone</p>
        <p><strong>Water Level:</strong> 22%</p>
        <p><strong>Faulty Asset:</strong> Pump P-3</p>
        <p><strong>Open Complaint:</strong> Leakage near Market Road</p>

    </div>

    <a href="/dashboard" class="button">
        Main Dashboard
    </a>

</div>

</body>
</html>
