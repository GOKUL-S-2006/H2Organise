<!DOCTYPE html>
<html>
<head>
    <title>Zone Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f7fa;
        }

        .navbar {
            background-color: #1f4e79;
            color: white;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            padding: 30px;
        }

        h1 {
            color: #333;
        }

        .section {
            background: white;
            padding: 20px;
            margin-top: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #eef2f6;
        }

        .critical {
            color: #d9534f;
            font-weight: bold;
        }

        .normal {
            color: #27ae60;
            font-weight: bold;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background-color: #1f4e79;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="navbar">
    H2Organise - Admin Portal
</div>

<div class="container">

    <h1>Zone Management</h1>

    <div class="section">

        <h2>Water Zones</h2>

        <table>

            <thead>
            <tr>
                <th>Zone ID</th>
                <th>Zone Name</th>
                <th>Water Level</th>
                <th>Zone Status</th>
                <th>Supply Schedule</th>
            </tr>
            </thead>

            <tbody>

            <tr>
                <td>1</td>
                <td>North Zone</td>
                <td>22%</td>
                <td class="critical">CRITICAL</td>
                <td>18:00 - 20:00</td>
            </tr>

            <tr>
                <td>2</td>
                <td>South Zone</td>
                <td>68%</td>
                <td class="normal">NORMAL</td>
                <td>09:00 - 11:00</td>
            </tr>

            </tbody>

        </table>

    </div>

    <div class="section">

        <h2>Zone Summary</h2>

        <p><strong>Total Zones:</strong> 2</p>
        <p><strong>Critical Zones:</strong> 1</p>
        <p><strong>Normal Zones:</strong> 1</p>

    </div>

    <a href="/admin/dashboard" class="button">
        Back to Admin Dashboard
    </a>

</div>

</body>
</html>
