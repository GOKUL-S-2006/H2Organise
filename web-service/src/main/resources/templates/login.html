<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>H2Organise | Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f8fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1f2937;
        }

        .login-container {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #0f3d56;
            margin-bottom: 8px;
        }

        .logo span {
            color: #15946b;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #15946b;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #0f3d56;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1c5874;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }

        .signup-link a {
            color: #0f5965;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="logo">
        H2<span>Organise</span>
    </div>

    <div class="subtitle">
        Water & Natural Resource Management
    </div>

    <form action="/login" method="post">

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
            >

        </div>


        <button type="submit">
            Login
        </button>

    </form>


    <div class="signup-link">

        Don't have an account?

        <a href="/signup">
            Sign up
        </a>

    </div>

</div>

</body>

</html>
