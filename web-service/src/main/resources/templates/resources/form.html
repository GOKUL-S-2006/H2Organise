<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Resource - H2Organise</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 230px;
            background-color: #1f4e79;
            color: white;
            padding: 25px 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 35px;
            padding-left: 10px;
        }

        .logo span {
            font-weight: normal;
        }

        .menu-title {
            font-size: 12px;
            color: #b8cce0;
            margin: 20px 10px 8px;
            text-transform: uppercase;
        }

        .menu a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 11px 10px;
            border-radius: 5px;
            margin-bottom: 4px;
        }

        .menu a:hover,
        .menu a.active {
            background-color: #163a5c;
        }

        .main {
            flex: 1;
        }

        .navbar {
            background-color: white;
            padding: 20px 30px;
            border-bottom: 1px solid #ddd;
            font-size: 22px;
            font-weight: bold;
            color: #333;
        }

        .content {
            padding: 30px;
        }

        .form-container {
            max-width: 700px;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #1f4e79;
        }

        .buttons {
            margin-top: 25px;
        }

        button {
            background-color: #1f4e79;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #163a5c;
        }

        .back {
            margin-left: 15px;
            text-decoration: none;
            color: #1f4e79;
        }
    </style>
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo">
            H2<span>Organise</span>
        </div>

        <div class="menu-title">Main</div>

        <div class="menu">
            <a href="/dashboard">🏠 Dashboard</a>
            <a href="/zones/1/status">💧 Zone Status</a>
            <a href="/resources" class="active">🌊 Resources</a>
            <a href="/distribution">🚰 Distribution</a>
            <a href="/quality">🧪 Water Quality</a>
            <a href="/maintenance">🔧 Maintenance</a>
            <a href="/complaints">📋 Complaints</a>
        </div>

        <div class="menu-title">Portals</div>

        <div class="menu">
            <a href="/citizen/dashboard">👤 Citizen Portal</a>
            <a href="/admin/dashboard">⚙️ Admin Portal</a>
        </div>

        <div class="menu-title">Account</div>

        <div class="menu">
            <a href="/logout">🚪 Logout</a>
        </div>

    </aside>

    <main class="main">

        <div class="navbar">
            Add Water Resource
        </div>

        <div class="content">

            <div class="form-container">

                <h2>Add Water Resource</h2>

                <p class="subtitle">
                    Enter the details of the new water resource.
                </p>

                <form>

                    <label>Resource Name</label>
                    <input type="text"
                           name="name"
                           placeholder="Enter resource name">

                    <label>Resource Type</label>
                    <select name="type">
                        <option value="RESERVOIR">Reservoir</option>
                        <option value="LAKE">Lake</option>
                        <option value="WELL">Well</option>
                        <option value="TANK">Tank</option>
                        <option value="RIVER">River</option>
                    </select>

                    <label>Location</label>
                    <input type="text"
                           name="location"
                           placeholder="Enter location">

                    <label>Zone</label>
                    <input type="text"
                           name="zone"
                           placeholder="Enter zone">

                    <label>Total Capacity (ML)</label>
                    <input type="number"
                           name="capacity"
                           placeholder="Enter capacity">

                    <label>Minimum Threshold (%)</label>
                    <input type="number"
                           name="threshold"
                           value="30">

                    <div class="buttons">

                        <button type="submit">
                            Save Resource
                        </button>

                        <a href="/resources" class="back">
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </main>

</div>

</body>
</html>
