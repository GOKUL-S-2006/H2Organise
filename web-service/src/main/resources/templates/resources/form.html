<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Resource Form - H2Organise</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        .navbar {
            background-color: #1f4e79;
            color: white;
            padding: 15px 30px;
            font-size: 20px;
        }

        .container {
            width: 600px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 6px;
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .buttons {
            margin-top: 25px;
        }

        button {
            background-color: #1f4e79;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 4px;
            cursor: pointer;
        }

        .back {
            margin-left: 10px;
            text-decoration: none;
            color: #1f4e79;
        }
    </style>
</head>

<body>

<div class="navbar">
    H2Organise
</div>

<div class="container">

    <h2>Add Water Resource</h2>

    <form>

        <label>Resource Name</label>
        <input type="text" name="name" placeholder="Enter resource name">

        <label>Resource Type</label>
        <select name="type">
            <option value="RESERVOIR">Reservoir</option>
            <option value="LAKE">Lake</option>
            <option value="WELL">Well</option>
            <option value="TANK">Tank</option>
            <option value="RIVER">River</option>
        </select>

        <label>Location</label>
        <input type="text" name="location" placeholder="Enter location">

        <label>Zone</label>
        <input type="text" name="zone" placeholder="Enter zone">

        <label>Total Capacity (ML)</label>
        <input type="number" name="capacity" placeholder="Enter capacity">

        <label>Minimum Threshold (%)</label>
        <input type="number" name="threshold" value="30">

        <div class="buttons">
            <button type="submit">Save Resource</button>

            <a href="/resources" class="back">Cancel</a>
        </div>

    </form>

</div>

</body>
</html>
