<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>H2Organise | Sign Up</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f8fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1f2937;
        }

        .signup-container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #0f3d56;
            margin-bottom: 8px;
        }

        .logo span {
            color: #15946b;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #15946b;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #0f3d56;
            color: white;
            font-size: 15px;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #1c5874;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }

        .login-link a {
            color: #0f5965;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

<div class="signup-container">

    <div class="logo">
        H2<span>Organise</span>
    </div>

    <div class="subtitle">
        Create your H2Organise account
    </div>


    <form action="/signup" method="post">

        <div class="form-group">

            <label for="name">
                Full Name
            </label>

            <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
            >

        </div>


        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    required
            >

        </div>


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
            >

        </div>


        <div class="form-group">

            <label for="role">
                Role
            </label>

            <select id="role" name="role">

                <option value="CITIZEN">
                    Citizen
                </option>

                <option value="ENGINEER">
                    Engineer
                </option>

            </select>

        </div>


        <button type="submit">
            Create Account
        </button>

    </form>


    <div class="login-link">

        Already have an account?

        <a href="/login">
            Login
        </a>

    </div>

</div>

</body>

</html>
